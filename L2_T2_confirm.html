<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 2</title>
</head>
<body>
  <script>
    let name = prompt("Введіть ваше ім'я:");
    let age = prompt("Введіть ваш вік:");

    let ok = confirm(`Hello, ${name}! Your age is ${age}. Continue?`);

    if (ok) {
      alert("Welcome!");
    } else {
      alert("Goodbye!");
    }
  </script>
</body>
</html>
