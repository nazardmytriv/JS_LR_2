<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 2</title>
</head>
<body>
  <p>Результат показано через alert.</p>
  <script>
    let age = prompt("Введіть ваш вік:");
    let currentYear = 2026; 
    let birthYear = currentYear - age;
    alert(`You were born in ${birthYear}`);
  </script>
</body>
</html>
