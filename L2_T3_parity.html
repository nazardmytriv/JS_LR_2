<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 3</title>
</head>
<body>
  <script>
    let num = prompt("Введіть число для перевірки на парність:");

    if (num % 2 === 0) {
      alert("Number is even");
    } else {
      alert("Number is odd");
    }
  </script>
</body>
</html>
